[build]
  publish = "."
  command = ""

[[headers]]
  for = "/African_Summer.mp4"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public,max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public,max-age=3600"
